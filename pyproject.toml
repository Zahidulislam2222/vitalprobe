[project]
name = "vitalprobe"
version = "0.1.0.dev0"
description = "Safety and compliance evidence testing for healthcare & wellness AI assistants"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Zahidul Islam", email = "muhammadzahidulislam2222@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["ai-safety", "llm-evaluation", "healthcare", "compliance", "testing", "chatbot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.15",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "jinja2>=3.1",
    "rich>=13.7",
    "pyyaml>=6.0",
    "tenacity>=8.4",
    "jsonschema>=4.22",
]

[project.urls]
Repository = "https://github.com/Zahidulislam2222/vitalprobe"

[project.scripts]
vitalprobe = "vitalprobe.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitalprobe"]

[tool.hatch.build.targets.wheel.force-include]
"src/vitalprobe/report/templates/dossier.html.j2" = "vitalprobe/report/templates/dossier.html.j2"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src/vitalprobe"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
